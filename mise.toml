min_version = "2026.9.13"

[tools]
python = "3.13.15"
node = "24.21.0"
uv = "0.12.19"
pnpm = "11.28.2"

[settings]
task.run_auto_install = false

[env]
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.setup]
description = "Install the pinned toolchain and all workspace members from fixed locks"
run = [
  "mise install",
  "mise exec -- uv sync --all-packages --locked",
  "mise exec -- pnpm install --frozen-lockfile",
]

[tasks.format]
description = "Format Python and TypeScript workspace sources and configuration"
run = ["uv run --all-packages --locked --offline ruff format .", "pnpm run format"]

[tasks."check:format"]
description = "Check workspace formatting without changing files"
run = ["uv run --all-packages --locked --offline ruff format --check .", "pnpm run format:check"]

[tasks."check:lint"]
description = "Lint Python and TypeScript workspace sources"
run = ["uv run --all-packages --locked --offline ruff check .", "pnpm run lint"]

[tasks."check:types"]
description = "Type-check Python and every TypeScript workspace member"
run = ["uv run --all-packages --locked --offline mypy", "pnpm run typecheck"]

[tasks."check:tickets"]
description = "Validate implementation ticket status and dependencies"
run = "uv run --all-packages --locked --offline python -B .agents/skills/implement-ticket/scripts/ticket_plan.py check"

[tasks.check]
description = "Run all available project checks"
depends = ["check:tickets", "check:format", "check:lint", "check:types"]

[tasks.test]
description = "Run foundation and existing ticket planner tests without external APIs"
run = [
  "uv run --all-packages --locked --offline python -B -m unittest discover -s tests -p 'test_*.py'",
  "uv run --all-packages --locked --offline python -B -m unittest discover -s .agents/skills/implement-ticket/scripts -p 'test_*.py'",
]
