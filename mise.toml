min_version = "2026.9.13"

[tools]
python = "3.13.15"
node = "24.21.0"
uv = "0.12.19"
pnpm = "11.28.2"

[settings]
task.run_auto_install = false

[env]
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.setup]
description = "Sync the uv project environment from the lockfile"
run = "uv sync --locked"

[tasks."check:tickets"]
description = "Validate implementation ticket status and dependencies"
run = "uv run --locked --offline python -B .agents/skills/implement-ticket/scripts/ticket_plan.py check"

[tasks.check]
description = "Run all available project checks"
depends = ["check:tickets"]

[tasks.test]
description = "Run the existing ticket planner unit tests"
run = "uv run --locked --offline python -B -m unittest discover -s .agents/skills/implement-ticket/scripts -p 'test_*.py'"
