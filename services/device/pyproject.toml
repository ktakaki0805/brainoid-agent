[project]
name = "brainoid-device"
version = "0.1.0"
description = "Raspberry Pi service package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brainoid-contracts",
    "brainoid-runs",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "securesystemslib[crypto]==1.3.1",
    "starlette==1.10.0",
    "tuf==7.0.1",
    "uvicorn==0.54.0",
    "websockets==17.3",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-contracts = { workspace = true }
brainoid-runs = { workspace = true }
