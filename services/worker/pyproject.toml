[project]
name = "brainoid-worker"
version = "0.1.0"
description = "Asynchronous worker package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brainoid-agent-core",
    "brainoid-memory",
    "brainoid-tools",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-agent-core = { workspace = true }
brainoid-memory = { workspace = true }
brainoid-tools = { workspace = true }
