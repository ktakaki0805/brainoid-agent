[project]
name = "brainoid-worker"
version = "0.1.0"
description = "Asynchronous worker package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brainoid-usage",
    "fastapi==0.162.0",
    "google-auth[requests]==2.62.0",
    "pydantic==2.14.1",
    "brainoid-contracts",
    "brainoid-jobs",
    "brainoid-persistence",
    "brainoid-agent-core",
    "brainoid-memory",
    "brainoid-tools",
    "brainoid-runs",
    "brainoid-policy",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-agent-core = { workspace = true }
brainoid-memory = { workspace = true }
brainoid-tools = { workspace = true }
brainoid-contracts = { workspace = true }
brainoid-jobs = { workspace = true }
brainoid-persistence = { workspace = true }
brainoid-runs = { workspace = true }
brainoid-policy = { workspace = true }
brainoid-usage = { workspace = true }
