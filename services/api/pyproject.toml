[project]
name = "brainoid-api"
version = "0.1.0"
description = "FastAPI startup, health checks and common error handling"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brainoid-usage",
    "brainoid-jobs",
    "brainoid-persistence",
    "brainoid-agent-core",
    "brainoid-contracts",
    "brainoid-memory",
    "brainoid-policy",
    "brainoid-tools",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "firebase-admin==7.7.0",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage==3.17.1",
    "pydantic==2.14.1",
    "pyjwt==2.15.1",
    "uvicorn==0.54.0",
    "brainoid-runs",
    "jsonschema==4.26.0",
    "websockets==17.3",
    "anyio==4.15.1",
    "httpx==0.28.1",
    "google-auth==2.62.0",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-agent-core = { workspace = true }
brainoid-memory = { workspace = true }
brainoid-tools = { workspace = true }
brainoid-contracts = { workspace = true }
brainoid-policy = { workspace = true }
brainoid-jobs = { workspace = true }
brainoid-persistence = { workspace = true }
brainoid-runs = { workspace = true }
brainoid-usage = { workspace = true }
