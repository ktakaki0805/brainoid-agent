[project]
name = "brainoid-api"
version = "0.1.0"
description = "HTTP API package; application starts in BA-FND-02"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brainoid-agent-core",
    "brainoid-memory",
    "brainoid-tools",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-agent-core = { workspace = true }
brainoid-memory = { workspace = true }
brainoid-tools = { workspace = true }
