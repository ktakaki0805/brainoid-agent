[project]
name = "brainoid-agent"
version = "0.1.0"
description = "Development tools for Brainoid Agent"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "openapi-spec-validator==0.9.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/agent_core", "packages/model_google", "packages/contracts", "packages/memory", "packages/tools", "packages/policy", "packages/jobs", "packages/persistence"]

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["tests/**/*.py", "services/**/*.py", "packages/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tests", "services", "packages/agent_core", "packages/model_google", "packages/contracts", "packages/memory", "packages/tools", "packages/policy", "packages/jobs", "packages/persistence", "scripts"]
