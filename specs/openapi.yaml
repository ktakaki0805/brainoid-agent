components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: Dedicated short-lived device token
  schemas:
    ResourceId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: サーバー発行のUUID。ハイフン付き表記を受理し、小文字に正規化する。
    FirebaseUid:
      type: string
      minLength: 1
      maxLength: 128
      description: Firebase UID。UUID制約を課さず、大文字小文字や空白を変換しない。
    ProviderId:
      type: string
      minLength: 1
      maxLength: 1024
      description: providerのopaque ID。Calendarのcalendar/event ID等。フィールド固有の上限がある場合はさらに制限する。
    UtcTimestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?(?:[Zz]|[+-][0-9]{2}:[0-9]{2})$'
      description: offset必須のRFC 3339。保存・応答はUTCのZ表記。小数秒は最大6桁。未知offsetの-00:00、うるう秒、UTC変換後の年1〜9999範囲外を拒否する。
    IanaTimezone:
      type: string
      format: iana-timezone
      minLength: 1
      maxLength: 80
      description: IANA名の存在をサーバーで検証する。Asia/Tokyo、UTC等。OS固有localtime、posix/、right/を許可しない。
    Version:
      type: integer
      minimum: 1
      description: 1から始まる更新版。文字列、boolean、浮動小数点からの型変換を行わない。
    Visibility:
      type: string
      enum: [private, shared]
    DisplayPolicy:
      type: string
      enum: [never, authenticated_session, shared_display]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[a-z][a-z0-9_]+$
            message:
              type: string
              maxLength: 300
            request_id: *id001
            retryable:
              type: boolean
            fields:
              type: array
              items:
                type: string
                maxLength: 100
              maxItems: 20
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Scope:
      type: object
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
        display_policy:
          $ref: '#/components/schemas/DisplayPolicy'
      required:
      - visibility
      - display_policy
      additionalProperties: false
      allOf:
      - if:
          properties:
            visibility:
              const: private
        then:
          properties:
            display_policy:
              type: string
              enum:
              - never
              - authenticated_session
    User:
      type: object
      properties:
        user_id: *id006
        display_name: &id009
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
        status:
          type: string
          enum:
          - active
          - deleting
        version:
          $ref: '#/components/schemas/Version'
      required:
      - user_id
      - display_name
      - timezone
      - status
      - version
      additionalProperties: false
    TenantCreate:
      type: object
      properties:
        name: *id009
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
