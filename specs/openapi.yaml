    DeviceOperationScope:
      type: string
      enum:
      - shared
      - conversation
      - memory.read
      - memory.write
      - notes
      - tasks
      - reminders
      - calendar.read
      - calendar.propose
      - home.control
    PairingCreate:
      description: Piサービス専用。installation_nonceは起動ごとに変更せず、初回deviceとtenantへ束縛される。
      type: object
      properties:
        device_name: *id009
        installation_nonce:
          type: string
          minLength: 32
          maxLength: 128
      required:
      - device_name
      - installation_nonce
      additionalProperties: false
    Pairing:
      description: Piサービスだけが受け取る。画面へ渡すのはuser_codeとexpires_atのみ。poll_secretをChromiumやURLへ渡さない。
      type: object
      properties:
        pairing_id: *id001
        user_code:
          type: string
          pattern: ^[A-Z0-9]{8}$
        poll_secret:
          type: string
          minLength: 32
          maxLength: 256
        expires_at: *id008
      required:
      - pairing_id
      - user_code
      - poll_secret
      - expires_at
      additionalProperties: false
    PairingConfirm:
      description: user_codeは4文字selectorと4文字secret。selector既知時のsecretは36^4通りで5回まで照合できる。
      type: object
      properties:
        user_code:
          type: string
          pattern: ^[A-Z0-9]{8}$
        device_name: *id009
        allowed_entity_ids:
          type: array
          items: *id001
          maxItems: 100
        replaces_device_id:
          description: 明示再登録。最新台帳で失効済みの同installation・同tenantの旧device ID。旧credentialは使わず新device IDを発行する。
          anyOf:
          - *id001
          - type: 'null'
      required:
      - user_code
      - device_name
      - allowed_entity_ids
      additionalProperties: false
    PairingExchange:
      type: object
      properties:
        poll_secret:
          type: string
          minLength: 32
          maxLength: 256
      required:
      - poll_secret
      additionalProperties: false
    DeviceCredentials:
      type: object
