        tenant_id: *id001
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          const: 900
        token_type:
          type: string
          const: Bearer
      required:
      - device_id
      - tenant_id
      - access_token
      - refresh_token
      - expires_in
      - token_type
      additionalProperties: false
    DeviceRefresh:
      type: object
      properties:
        device_id: *id001
        refresh_token:
          type: string
          minLength: 32
          maxLength: 512
