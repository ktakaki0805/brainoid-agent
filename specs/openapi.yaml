            text/event-stream:
              schema:
                type: string
              example: 'id: 1

                event: run.started

                data: {"run_id":"32ad4324-a25f-468f-88e6-a5f4ae34e076","seq":1,"type":"run.started","occurred_at":"2026-10-25T10:00:00Z","payload":{}}


