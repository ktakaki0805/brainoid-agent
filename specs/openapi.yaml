      operationId: downloadExport
      summary: 本人のexportを取得
      description: 明示local構成で提供。export成功・受付から24時間以内のみ。本人の現在membership・owner・全manifestの版/削除epoch/依存権限とobject期限を各取得およびstream送信境界で再検査する。公開URLを返さない。200はdata.jsonを含むZIP。上限200対象・非圧縮4MiB、走査5000対象を超える場合はoperation失敗とし部分出力しない。実非公開一時bucketはBA-OPS-02の外部前提。
      security:
      - userBearer: []
      responses:
        '200':
          description: 認可済みdata.jsonを含むZIP。Cache-Controlはno-store
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: operation_id
        in: path
        required: true
        schema: *id001
  /operations:
    post:
      operationId: createAccountOperation
      summary: 本人アカウント削除を受け付ける
      description: 直近5分の再認証が必要。最後のownerの場合409 ownership_transfer_required。
      security:
      - userBearer: []
      responses:
        '202':
          description: 成功（local-emulatorと明示fake構成。実環境の受付は未公開）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountOperationCreate'
  /operations/{operation_id}:
    get:
      operationId: getAccountOperation
      summary: 本人アカウント処理状態
      description: 削除中の既存認証は当該status参照だけに限定。最終処理後は404となる。現在のlocal-emulatorと明示fake構成は実Firebase認証を失効させない。実provider失効adapterは未提供。
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功（local-emulatorと明示fake構成。実環境の受付は未公開）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operation_id
        in: path
        required: true
        schema: *id001
  /tenants/{tenant_id}/usage:
    get:
      operationId: getUsage
      summary: 本人に許可された利用量・残枠
      description: owner/adminはtenant総量、memberは本人分。UTC当月集計。音声秒は未確定予約を含み、残要求数は本人とtenantの枠の小さい方。queryによる他人の明細選択は不可。価格見積りを確定請求額と表示しない。
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: Dedicated short-lived device token
  schemas:
    ResourceId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: サーバー発行のUUID。ハイフン付き表記を受理し、小文字に正規化する。
    FirebaseUid:
      type: string
      minLength: 1
      maxLength: 128
      description: Firebase UID。UUID制約を課さず、大文字小文字や空白を変換しない。
    ProviderId:
      type: string
      minLength: 1
      maxLength: 1024
      description: providerのopaque ID。Calendarのcalendar/event ID等。フィールド固有の上限がある場合はさらに制限する。
    UtcTimestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?(?:[Zz]|[+-][0-9]{2}:[0-9]{2})$'
      description: offset必須のRFC 3339。保存・応答はUTCのZ表記。小数秒は最大6桁。未知offsetの-00:00、うるう秒、UTC変換後の年1〜9999範囲外を拒否する。
    IanaTimezone:
      type: string
      format: iana-timezone
      minLength: 1
      maxLength: 80
      description: IANA名の存在をサーバーで検証する。Asia/Tokyo、UTC等。OS固有localtime、posix/、right/を許可しない。
    Version:
      type: integer
      minimum: 1
      description: 1から始まる更新版。文字列、boolean、浮動小数点からの型変換を行わない。
    Visibility:
      type: string
      enum: [private, shared]
    DisplayPolicy:
      type: string
      enum: [never, authenticated_session, shared_display]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[a-z][a-z0-9_]+$
            message:
              type: string
              maxLength: 300
            request_id: *id001
            retryable:
              type: boolean
            fields:
              type: array
              items:
                type: string
                maxLength: 100
              maxItems: 20
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Scope:
      type: object
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
        display_policy:
          $ref: '#/components/schemas/DisplayPolicy'
      required:
      - visibility
      - display_policy
      additionalProperties: false
      allOf:
      - if:
          properties:
            visibility:
              const: private
        then:
          properties:
            display_policy:
              type: string
              enum:
              - never
              - authenticated_session
    User:
      type: object
      properties:
        user_id: *id006
        display_name: &id009
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
        status:
          type: string
          enum:
          - active
          - deleting
        version:
          $ref: '#/components/schemas/Version'
      required:
      - user_id
      - display_name
      - timezone
      - status
      - version
      additionalProperties: false
    TenantCreate:
      type: object
      properties:
        name: *id009
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
          default: Asia/Tokyo
      required:
      - name
      additionalProperties: false
    Tenant:
      type: object
      properties:
        id: *id001
        tenant_id: *id001
        version: &id010
          $ref: '#/components/schemas/Version'
        created_at: *id008
        updated_at: *id008
        name: *id009
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
        status:
          type: string
          enum:
          - active
          - deleting
        my_role:
          type: string
          enum:
          - owner
          - admin
          - member
      required:
      - id
      - tenant_id
      - version
      - created_at
      - updated_at
      - name
      - timezone
      - status
      - my_role
      additionalProperties: false
    TenantPage:
      type: object
      properties:
        items:
          type: array
