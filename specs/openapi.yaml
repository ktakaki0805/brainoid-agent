openapi: 3.1.0
info:
  title: Brainoid Agent API contract
  version: 0.2.0
  description: 開発着手用設計案。BA-FND-02のhealth・共通エラー、BA-IAM-01の本人認証・users/meを実装済み。他の業務APIは未実装。サーバーはscope/権限/クロスフィールド制約を検証する。
servers:
- url: /v1
  description: 実装先APIの相対base path
paths:
  /health/live:
    servers:
    - url: /
      description: healthは業務APIの/v1外に配置
    get:
      operationId: getLiveness
      summary: APIプロセスの生存確認
      description: 認証・依存先への接続を行わず応答する。依存先の確認はreadinessを使う。
      security: []
      responses:
        '200':
          description: プロセスがHTTP要求に応答できる
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: サーバー発行の要求ID。呼出元の値は採用しない。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /health/ready:
    servers:
    - url: /
    get:
      operationId: getReadiness
      summary: 起動完了と注入された依存先の可用性確認
      description: 現時点の標準構成には外部adapterがない。組込時にprobeを登録し、false・例外・設定時間内の応答なしを503にする。依存先の詳細は公開しない。
      security: []
      responses:
        '200':
          description: 起動済みで登録された全probeが正常
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        '503':
          description: 起動未完了または依存先を利用できない。retryableはtrue。
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: error.request_idと同じ要求ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    get:
      operationId: getCurrentUser
      summary: 本人プロフィール
      description: 検証済みFirebase UIDに一致する保存済みの本人プロフィール。未作成は404、削除中は403。
      security:
      - userBearer: []
      responses:
        '200':
          description: 保存済みの本人プロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tenants:
    get:
      operationId: listTenants
      summary: 所属テナント一覧
      description: 本人の現在有効な所属のみ。tenant ID昇順。cursorは現在の所属集合・limitに束縛し、権限変更後は400。
      security:
      - userBearer: []
      responses:
        '200':
          description: 現在の認可を通して取得したテナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id004
        name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
    post:
      operationId: createTenant
      summary: テナント作成・本人をownerに登録
      description: tenant・本人owner・初期agentを原子的に作成。profile未作成も利用可能。user単位の冪等キーは24時間有効。再送は現在ownerを再確認し、現在のTenantを201で返す。
      security:
      - userBearer: []
      responses:
        '201':
          description: 現在の認可を通して取得したテナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id002
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 同一scopeで24時間。同一keyの異なるbodyは409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
  /tenants/{tenant_id}:
    get:
      operationId: getTenant
      summary: テナント取得
      description: 選択したtenantの現在membershipを照合して取得。未所属・失効・削除中は404。
      security:
      - userBearer: []
      responses:
        '200':
          description: 現在の認可を通して取得したテナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: &id001
          $ref: '#/components/schemas/ResourceId'
    patch:
      operationId: updateTenant
      summary: テナント設定更新
      description: 現在のowner/adminのみ。正規化patchとIf-Match版に冪等キーを束縛。再送は二重更新せず現在のTenantを返す。
      security:
      - userBearer: []
      responses:
        '200':
          description: 現在の認可を通して取得したテナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id002
      - &id005
        name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: 直前に取得したversionを引用符付きで指定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPatch'
  /tenants/{tenant_id}/memberships:
    get:
      operationId: listMemberships
      summary: 会員一覧
      description: 現在のowner/adminのみ。会員ID・role・status・整数認可版だけを返す。cursorは現在の認可と一覧状態へ束縛する。
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id003
      - *id004
    patch:
      operationId: updateMembershipByUid
      summary: opaque UIDをqueryで指定する会員role更新
      description: owner/adminのみ。owner付与/剥奪はownerのみ。本人ownerの降格は別の有効ownerが必要。Idempotency-Keyと対象のIf-Matchを固定して再送する。tenant予約から台帳確定まで直列化し、未確定変更を同じ要求で再開する。user_idを必須queryとして渡し、`.`・`..`・slashを含むFirebase opaque UIDをURL pathの正規化から保護する。
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: user_id
        in: query
        required: true
        schema: &id006
          $ref: '#/components/schemas/FirebaseUid'
      - *id002
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipPatch'
    delete:
      operationId: revokeMembershipByUid
      summary: opaque UIDをqueryで指定する会員失効
      description: owner/adminと直近5分の再認証が必要。owner失効はownerのみ。本人退出はoperationsを使う。最後の有効ownerは失効不可。Idempotency-Keyと対象のIf-Matchを固定して再送する。本文やFirebase accountを削除する権限は与えず、このAPIは当該所属の失効だけを行う。user_idは必須queryで、`.`・`..`・slashを含むUIDをそのまま指定できる。
      security:
      - userBearer: []
      responses:
        '204':
          description: 成功
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: user_id
        in: query
        required: true
        schema: *id006
      - *id002
      - *id005
  /tenants/{tenant_id}/memberships/{user_id}:
    patch:
      operationId: updateMembership
      summary: 会員role更新
      description: owner/adminのみ。owner付与/剥奪はownerのみ。本人ownerの降格は別の有効ownerが必要。Idempotency-Keyと対象のIf-Matchを固定して再送する。tenant予約から台帳確定まで直列化し、未確定変更を同じ要求で再開する。既存path互換API。`.`・`..`などURLで正規化されるUIDにはupdateMembershipByUidのquery経路を使う。
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: user_id
        in: path
        required: true
        schema: *id006
      - *id002
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipPatch'
    delete:
      operationId: revokeMembership
      summary: 会員失効
      description: owner/adminと直近5分の再認証が必要。owner失効はownerのみ。本人退出はoperationsを使う。最後の有効ownerは失効不可。Idempotency-Keyと対象のIf-Matchを固定して再送する。本文やFirebase accountを削除する権限は与えず、このAPIは当該所属の失効だけを行う。既存path互換API。任意opaque UIDにはrevokeMembershipByUidのquery経路を使う。
      security:
      - userBearer: []
      responses:
        '204':
          description: 成功
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: user_id
        in: path
        required: true
        schema: *id006
      - *id002
      - *id005
  /tenants/{tenant_id}/memberships:transfer-owner:
    post:
      operationId: transferOwner
      summary: 本人から別の会員へownerを移譲
      description: 現在owner本人と直近5分の再認証が必要。If-Matchは本人の認可版、target_versionは対象の認可版。対象のowner grantを確定してから本人をmemberへ変更し、途中失敗でも有効ownerを保持する。Idempotency-Keyと同じ本文・If-Matchで再送する。成功時は対象のMembershipとETagを返す。
      security:
      - userBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id002
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerTransfer'
      responses:
        '200':
          description: 移譲完了
          headers:
            ETag:
              schema:
                type: string
              description: 移譲先の引用符付き認可版
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tenants/{tenant_id}/invitations:
    post:
      operationId: createInvitation
      summary: 招待コード作成
      description: owner/admin が24時間有効な一回利用コードを発行する。owner付与不可。Idempotency-Key再送は現在の管理権限・未使用・期限を再確認して同じコードを返す。membership減権限で同テナントの既存招待は無効になる。
      security:
      - userBearer: []
      responses:
        '201':
          description: 成功（同一operationの再送を含む）。Cache-Controlはno-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
  /invitations:accept:
    post:
      operationId: acceptInvitation
      summary: 本人が招待を受理
      description: 検証済み本人がコードを受諾する。UIDごと15分5回まで照合し、期限と一回性を原子的にclaimする。同じkey/codeは固定operationを再試行し、最新台帳のDB適用確認済みgrantのみで所属を有効にする。失効後は新しく発行された招待と別keyが必要。
      security:
      - userBearer: []
      responses:
        '201':
          description: 成功（同一operationの再送を含む）。Cache-Controlはno-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
  /tenants/{tenant_id}/agents:
    get:
      operationId: listAgents
      summary: 利用可能な人格一覧
      description: 利用可能な人格一覧
      security:
      - userBearer: []
      - deviceBearer: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id003
      - *id004
      - &id007
        name: X-Private-Session
        in: header
        required: false
        schema: *id001
        description: device bearerに追加するセッション参照。単独では認証しない。
  /tenants/{tenant_id}/agents/{agent_id}:
    get:
      operationId: getAgent
      summary: 人格取得
      description: 人格取得
      security:
      - userBearer: []
      - deviceBearer: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: agent_id
        in: path
        required: true
        schema: *id001
      - *id007
    patch:
      operationId: updateAgent
      summary: 共有人格更新
      description: 共有人格更新
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - name: agent_id
        in: path
        required: true
        schema: *id001
      - *id002
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPatch'
  /device-pairings:
    post:
      operationId: createDevicePairing
      summary: 未登録Piが短命ペアリングを開始
      description: 未認証endpoint。IP/installation rate limit、5分失効。poll_secretをログへ出さない。
      security: []
      responses:
        '201':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCreate'
  /tenants/{tenant_id}/device-pairings:confirm:
    post:
      operationId: confirmDevicePairing
      summary: スマホ管理者が物理端末を確認して登録
      description: スマホ管理者が物理端末を確認して登録
      security:
      - userBearer: []
      responses:
        '201':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConfirm'
  /device-pairings/{pairing_id}:exchange:
    post:
      operationId: exchangeDevicePairing
      summary: Piがpoll_secretで一回だけ資格情報を受取る
      description: 未承認は409 pairing_pending。poll_secret不一致は404。期限切れ410。一回利用。
      security: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentials'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: pairing_id
        in: path
        required: true
        schema: *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingExchange'
  /device-tokens:refresh:
    post:
      operationId: refreshDeviceToken
      summary: Pi専用credentialを更新
      description: refresh_token自体を検証。短い同一refresh_request_id再送猶予とreuse検知を実装。
      security: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentials'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRefresh'
  /tenants/{tenant_id}/devices:
    get:
      operationId: listDevices
      summary: 登録端末一覧
      description: 登録端末一覧
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id003
      - *id004
  /tenants/{tenant_id}/devices/{device_id}:
    get:
      operationId: getDevice
      summary: 端末情報
      description: 端末情報
      security:
      - userBearer: []
      responses:
        '200':
          description: 成功（契約上の応答。実装は未提供）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          headers:
            ETag:
              schema:
                type: string
              description: 引用符付きversion
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
