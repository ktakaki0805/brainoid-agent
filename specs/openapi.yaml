              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: 共通エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema: *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
