[project]
name = "brainoid-memory"
version = "0.1.0"
description = "Validated graph memory and tenant-bound transactional persistence"
requires-python = ">=3.13,<3.14"
dependencies = ["brainoid-contracts", "brainoid-policy", "brainoid-jobs", "pydantic==2.14.1"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-contracts = { workspace = true }
brainoid-policy = { workspace = true }
brainoid-jobs = { workspace = true }
