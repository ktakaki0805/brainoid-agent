[project]
name = "brainoid-persistence"
version = "0.1.0"
description = "Shared persistence boundary"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brainoid-contracts",
    "brainoid-memory",
    "google-cloud-firestore==2.34.1",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-contracts = { workspace = true }
brainoid-memory = { workspace = true }
