[project]
name = "brainoid-usage"
version = "0.1.0"
description = "Transactional content-free usage reservations and settlement"
requires-python = ">=3.13,<3.14"
dependencies = ["brainoid-contracts", "pydantic==2.14.1"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv.sources]
brainoid-contracts = { workspace = true }
