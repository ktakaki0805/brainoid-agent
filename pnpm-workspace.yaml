packages:
  - apps/*
  - packages/ui
  - packages/api-client

engineStrict: true
# Standalone pnpm embeds its own Node; check dependencies against mise's runtime.
nodeVersion: 24.21.0
pmOnFail: error
autoInstallPeers: false
strictPeerDependencies: true
# No install lifecycle scripts are needed by this foundation.
allowBuilds: {}
