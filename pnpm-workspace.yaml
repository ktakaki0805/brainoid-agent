packages:
  - apps/*
  - packages/ui
  - packages/api-client
  - packages/openapi-generator

engineStrict: true
# Standalone pnpm embeds its own Node; check dependencies against mise's runtime.
nodeVersion: 24.21.0
pmOnFail: error
verifyDepsBeforeRun: error
autoInstallPeers: false
strictPeerDependencies: true
# Auth/Firestore do not use the optional RE2 native matcher or protobuf's install notice.
allowBuilds:
  "@firebase/util": false
  re2: false
  protobufjs: false
